<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - StreamApp</title>
    
    <!-- Video.js CSS Theme -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/city/index.css" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #141414; color: #fff; padding-bottom: 50px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: #000; }
        header a { color: #e50914; text-decoration: none; font-size: 24px; font-weight: bold; }
        .main-watch { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ensure Video.js fills container */
        .video-js { width: 100% !important; height: 100% !important; }

        .details-container { margin-top: 25px; background: #1f1f1f; padding: 25px; border-radius: 8px; }
        .media-title { font-size: 28px; margin-bottom: 10px; }
        .meta-info { color: #aaa; font-size: 14px; margin-bottom: 15px; }
        .synopsis { line-height: 1.6; color: #ddd; }
        
        .error-message {
            text-align: center;
            color: #aaa;
            padding: 20px;
        }
        .error-message h2 {
            color: #e50914;
            margin-bottom: 10px;
        }
        .error-message a {
            color: #fff;
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #e50914;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">StreamApp</a>
    </header>

    <main class="main-watch">
        <div class="video-container" id="player-container"></div>

        <div class="details-container">
            <h1 class="media-title" id="title">Loading...</h1>
            <div class="meta-info" id="meta"></div>
            <p class="synopsis" id="synopsis"></p>
        </div>
    </main>

    <!-- Video.js Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="movies.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mediaId = urlParams.get("id");
            const playerContainer = document.getElementById("player-container");

            // Make sure movies array exists in movies.js
            if (typeof movies === "undefined" || !Array.isArray(movies)) {
                showError("Configuration Error", "Unable to load movie data (movies.js is missing or invalid).");
                return;
            }

            // Find movie by matching ID (or title fallback if id is omitted)
            const item = movies.find(m => 
                (m.id && String(m.id) === String(mediaId)) || 
                (m.title && encodeURIComponent(m.title) === mediaId)
            );

            if (!item) {
                showError("Movie Not Found", "The requested movie could not be found.");
                return;
            }

            // Set Details
            document.getElementById("title").textContent = item.title || "Untitled";
            document.getElementById("meta").textContent = [item.year, item.genre].filter(Boolean).join(" | ");
            document.getElementById("synopsis").textContent = item.synopsis || "No description available.";

            // Check if video link is present
            if (!item.video || item.video.trim() === "") {
                playerContainer.innerHTML = `
                    <div class="error-message">
                        <h2>No Stream Available</h2>
                        <p>Video source is missing for this title.</p>
                    </div>
                `;
                return;
            }

            // Safely destroy existing instance if re-initializing
            if (videojs.getPlayers()['custom-player']) {
                videojs.getPlayers()['custom-player'].dispose();
            }

            // Inject video player element
            playerContainer.innerHTML = `
                <video id="custom-player" class="video-js vjs-theme-city" controls autoplay playsinline poster="${item.poster || ''}">
                    <source src="${item.video}" type="video/mp4">
                </video>
            `;

            // Initialize Video.js
            videojs('custom-player');
        });

        function showError(title, message) {
            document.getElementById("title").textContent = title;
            document.getElementById("player-container").innerHTML = `
                <div class="error-message">
                    <h2>${title}</h2>
                    <p>${message}</p>
                    <a href="index.html">Return to Home</a>
                </div>
            `;
        }
    </script>
</body>
</html>
