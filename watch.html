<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - StreamApp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #141414;
            color: #fff;
            padding-bottom: 50px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #000;
        }

        header a {
            color: #e50914;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        .main-watch {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 250px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .details-container {
            margin-top: 25px;
            background: #1f1f1f;
            padding: 25px;
            border-radius: 8px;
        }

        .media-title {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .meta-info {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .synopsis {
            line-height: 1.6;
            color: #ddd;
        }

        /* Series Episode Selector Styling */
        .episodes-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .episodes-section h3 {
            margin-bottom: 12px;
        }

        .episode-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ep-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .ep-btn:hover {
            background-color: #444;
        }

        .ep-btn.active {
            background-color: #e50914;
        }

        .error-msg {
            text-align: center;
            margin-top: 80px;
            font-size: 22px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">StreamApp</a>
    </header>

    <main class="main-watch" id="main-content">
        <div class="video-container">
            <video id="player" controls playsinline crossorigin="anonymous">
                <source id="video-source" src="" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>
        </div>

        <div class="details-container">
            <h1 class="media-title" id="title">Loading...</h1>
            <div class="meta-info" id="meta"></div>
            <p class="synopsis" id="synopsis"></p>

            <div class="episodes-section" id="episodes-container" style="display: none;">
                <h3>Episodes</h3>
                <div class="episode-list" id="episode-list"></div>
            </div>
        </div>
    </main>

    <!-- External JavaScript Data Files -->
    <script src="movies.js"></script>
    <script src="series.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Get ID parameter from URL (e.g. watch.html?id=m-godfather)
            const urlParams = new URLSearchParams(window.location.search);
            const mediaId = urlParams.get("id");

            const player = document.getElementById("player");
            const videoSource = document.getElementById("video-source");

            // Look up media in both movies.js and series.js safely
            const allMovies = typeof movies !== "undefined" ? movies : [];
            const allSeries = typeof series !== "undefined" ? series : [];

            const foundMovie = allMovies.find(m => String(m.id) === String(mediaId));
            const foundSeries = allSeries.find(s => String(s.id) === String(mediaId));
            const item = foundMovie || foundSeries;

            // If no item is found, show error message
            if (!item) {
                document.getElementById("main-content").innerHTML = `
                    <div class="error-msg">
                        <h2>Media Not Found</h2>
                        <p style="margin-top: 10px; font-size: 14px;">Please return to <a href="index.html" style="color: #e50914;">home page</a>.</p>
                    </div>
                `;
                return;
            }

            // Populate Metadata
            document.title = `${item.title} - StreamApp`;
            document.getElementById("title").textContent = item.title;
            document.getElementById("meta").textContent = `${item.year || ''} | ${item.genre || ''}`;
            document.getElementById("synopsis").textContent = item.synopsis || "No description available.";

            // Helper function to safely update and trigger video playback
            function loadVideo(url) {
                if (!url) return;
                player.pause();
                videoSource.src = url;
                player.load();
            }

            // Handle Movie playback vs Series playback
            if (foundMovie) {
                loadVideo(foundMovie.video);
            } else if (foundSeries && foundSeries.episodes && foundSeries.episodes.length > 0) {
                const epContainer = document.getElementById("episodes-container");
                const epList = document.getElementById("episode-list");
                epContainer.style.display = "block";

                // Generate Episode Buttons
                foundSeries.episodes.forEach((ep, index) => {
                    const btn = document.createElement("button");
                    btn.className = `ep-btn ${index === 0 ? 'active' : ''}`;
                    btn.textContent = ep.name || `Episode ${index + 1}`;
                    
                    btn.addEventListener("click", () => {
                        document.querySelectorAll(".ep-btn").forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        loadVideo(ep.url);
                    });

                    epList.appendChild(btn);
                });

                // Load first episode by default
                loadVideo(foundSeries.episodes[0].url);
            }
        });
    </script>
</body>
</html>
