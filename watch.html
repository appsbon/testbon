<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - StreamApp</title>
    
    <!-- FontAwesome Icons for Custom Controls -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #141414; color: #fff; padding-bottom: 50px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: #000; }
        header a { color: #e50914; text-decoration: none; font-size: 24px; font-weight: bold; }
        .main-watch { max-width: 1280px; margin: 30px auto; padding: 0 20px; }

        /* Custom Video Player Styling */
        .video-container {
            position: relative;
            object-fit: cover;
            max-width: 1280px;
            height: 720px;
            overflow: hidden;
            border: 5px solid #000;
            border-radius: 10px;
            background-color: black;
            margin: 0 auto;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.3s ease;
        }

        .custom-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            font-size: 40px;
            padding: 20px;
            cursor: pointer;
            z-index: 15;
            border-radius: 50%;
        }

        .custom-play-btn.hidden {
            display: none;
        }

        /* Controls styling */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            z-index: 10;
        }

        .play-btn, .volume-control, .fullscreen-btn {
            font-size: 24px;
            cursor: pointer;
            z-index: 15;
        }

        .fullscreen-btn {
            padding-left: 10px;
            font-size: 24px;
            cursor: pointer;
            z-index: 15;
        }

        .progress-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
        }

        .progress-bar {
            width: 95%;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            position: relative;
            cursor: pointer;
        }

        .progress {
            height: 100%;
            background: #fff;
            width: 0;
            transition: width 0.1s;
        }

        .buffered {
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            width: 0;
            position: absolute;
            top: 0;
            left: 0;
        }

        .progress-thumb {
            width: 15px;
            height: 15px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        .volume-slider-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .volume-slider {
            width: 100px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            position: relative;
            margin-left: 10px;
        }

        .volume-progress {
            height: 100%;
            background: #fff;
            width: 0%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .volume-thumb {
            width: 15px;
            height: 15px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 2;
        }

        #loadingOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
        }

        .spinner {
            border: 8px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 8px solid #ffffff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Adjustments */
        @media (max-width: 1280px) {
            .video-container {
                height: 300px;
                overflow: hidden;
                position: relative;
            }
            video {
                width: 100%;
                height: 100%;
                object-fit: contain;
                position: absolute;
            }
            .play-btn {
                font-size: 20px;
            }
            .volume-slider {
                display: none;
            }
        }

        /* Series / Episode Section */
        .episodes-section {
            margin-top: 25px;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            display: none; /* hidden unless item is a series */
        }

        .episodes-section h3 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #fff;
        }

        .episode-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .season-select {
            padding: 8px 12px;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            cursor: pointer;
        }

        .episodes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .episode-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-size: 14px;
        }

        .episode-btn:hover {
            background: #3a3a3a;
        }

        .episode-btn.active {
            background: #e50914;
            border-color: #e50914;
            font-weight: bold;
        }

        .details-container { margin-top: 25px; background: #1f1f1f; padding: 25px; border-radius: 8px; }
        .media-title { font-size: 28px; margin-bottom: 10px; }
        .meta-info { color: #aaa; font-size: 14px; margin-bottom: 15px; }
        .synopsis { line-height: 1.6; color: #ddd; }
    </style>
</head>
<body>

    <header>
        <a href="index.html">StreamApp</a>
    </header>

    <main class="main-watch">
        <div class="video-container">
            <video controlslist="nodownload" id="myVideo" oncontextmenu="return false;" preload="auto">
               <source id="videoSource" src="" type="video/mp4"></source>
               Your browser does not support the video tag.
            </video>
            <button class="custom-play-btn" id="customPlayPauseButton"><i class="fas fa-play"></i></button>
            <div class="controls">
                <div class="play-btn" id="playPauseButton">
                    <i class="fas fa-play"></i>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                        <div class="progress-thumb" id="progressThumb"></div>
                        <div class="buffered" id="buffered"></div>
                    </div>
                </div>
                <div class="volume-slider-container">
                    <div class="volume-control" id="volumeControl">
                        <i class="fas fa-volume-up"></i>
                    </div>
                    <div class="volume-slider">
                        <div class="volume-progress" id="volumeProgress"></div>
                        <div class="volume-thumb" id="volumeThumb"></div>
                    </div>
                </div>
                <div class="fullscreen-btn" id="fullscreenButton">
                    <i class="fas fa-expand"></i>
                </div>
            </div>
            <div id="loadingOverlay">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Series Episodes Navigation Container -->
        <div class="episodes-section" id="episodesSection">
            <h3>Episodes</h3>
            <div class="episode-controls">
                <select class="season-select" id="seasonSelect"></select>
            </div>
            <div class="episodes-grid" id="episodesGrid"></div>
        </div>

        <div class="details-container">
            <h1 class="media-title" id="title">Loading...</h1>
            <div class="meta-info" id="meta"></div>
            <p class="synopsis" id="synopsis"></p>
        </div>
    </main>

    <!-- Load external movies data file -->
    <script src="movies.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const mediaId = urlParams.get("id");

        const video = document.getElementById('myVideo');
        const videoSource = document.getElementById('videoSource');
        const episodesSection = document.getElementById('episodesSection');
        const seasonSelect = document.getElementById('seasonSelect');
        const episodesGrid = document.getElementById('episodesGrid');

        function playVideo(videoUrl) {
            videoSource.src = videoUrl;
            video.load();
            video.play().catch(e => console.log('Autoplay prevented or paused:', e));
        }

        if (typeof movies !== "undefined" && Array.isArray(movies)) {
            const item = movies.find(m => 
                (m.id && String(m.id) === String(mediaId)) || 
                (m.title && encodeURIComponent(m.title) === mediaId)
            );

            if (item) {
                document.getElementById("title").textContent = item.title || "Untitled";
                document.getElementById("meta").textContent = [item.year, item.genre].filter(Boolean).join(" | ");
                document.getElementById("synopsis").textContent = item.synopsis || "No synopsis available.";
                
                if (item.poster) {
                    video.poster = item.poster;
                }

                // Check if item is a Series or Movie
                if (item.episodes && Array.isArray(item.episodes) && item.episodes.length > 0) {
                    episodesSection.style.display = 'block';

                    // Group episodes by season
                    const seasons = {};
                    item.episodes.forEach(ep => {
                        const sNum = ep.season || 1;
                        if (!seasons[sNum]) seasons[sNum] = [];
                        seasons[sNum].push(ep);
                    });

                    // Populate Season Dropdown
                    seasonSelect.innerHTML = '';
                    Object.keys(seasons).forEach(sNum => {
                        const opt = document.createElement('option');
                        opt.value = sNum;
                        opt.textContent = `Season ${sNum}`;
                        seasonSelect.appendChild(opt);
                    });

                    function renderEpisodes(seasonNum) {
                        episodesGrid.innerHTML = '';
                        const currentEpisodes = seasons[seasonNum] || [];

                        currentEpisodes.forEach((ep, index) => {
                            const btn = document.createElement('button');
                            btn.className = 'episode-btn';
                            btn.textContent = ep.title || `Episode ${ep.episode || index + 1}`;
                            
                            btn.addEventListener('click', () => {
                                document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
                                btn.classList.add('active');
                                playVideo(ep.video || ep.src);
                            });

                            episodesGrid.appendChild(btn);
                        });

                        // Play the first episode automatically on render
                        if (currentEpisodes.length > 0) {
                            const firstBtn = episodesGrid.querySelector('.episode-btn');
                            if (firstBtn) firstBtn.classList.add('active');
                            playVideo(currentEpisodes[0].video || currentEpisodes[0].src);
                        }
                    }

                    seasonSelect.addEventListener('change', (e) => {
                        renderEpisodes(e.target.value);
                    });

                    // Initial render for Season 1
                    renderEpisodes(Object.keys(seasons)[0]);

                } else if (item.seasons && Array.isArray(item.seasons)) {
                    // Alternative data format: item.seasons = [{ season: 1, episodes: [...] }]
                    episodesSection.style.display = 'block';
                    seasonSelect.innerHTML = '';

                    item.seasons.forEach((seasonObj, idx) => {
                        const opt = document.createElement('option');
                        opt.value = idx;
                        opt.textContent = `Season ${seasonObj.season || idx + 1}`;
                        seasonSelect.appendChild(opt);
                    });

                    function renderSeasonsFormat(seasonIdx) {
                        episodesGrid.innerHTML = '';
                        const eps = item.seasons[seasonIdx]?.episodes || [];

                        eps.forEach((ep, epIdx) => {
                            const btn = document.createElement('button');
                            btn.className = 'episode-btn';
                            btn.textContent = ep.title || `Episode ${ep.episode || epIdx + 1}`;

                            btn.addEventListener('click', () => {
                                document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
                                btn.classList.add('active');
                                playVideo(ep.video || ep.src);
                            });

                            episodesGrid.appendChild(btn);
                        });

                        if (eps.length > 0) {
                            const firstBtn = episodesGrid.querySelector('.episode-btn');
                            if (firstBtn) firstBtn.classList.add('active');
                            playVideo(eps[0].video || eps[0].src);
                        }
                    }

                    seasonSelect.addEventListener('change', (e) => {
                        renderSeasonsFormat(e.target.value);
                    });

                    renderSeasonsFormat(0);

                } else {
                    // Standard Movie
                    if (item.video) {
                        videoSource.src = item.video;
                        video.load();
                    }
                }

            } else {
                document.getElementById("title").textContent = "Item Not Found";
            }
        }

        // Custom Player Controls Logic
        const customPlayPauseButton = document.getElementById('customPlayPauseButton');
        const playPauseButton = document.getElementById('playPauseButton');
        const progress = document.getElementById('progress');
        const buffered = document.getElementById('buffered');
        const progressThumb = document.getElementById('progressThumb');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.querySelector('.volume-slider');
        const volumeProgress = document.getElementById('volumeProgress');
        const volumeThumb = document.getElementById('volumeThumb');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const fullscreenButton = document.getElementById('fullscreenButton');
        const progressBar = document.querySelector('.progress-bar');
        
        let isDragging = false;
        let isVolumeDragging = false;

        function updatePlayPauseButton() {
            const icon = video.paused || video.ended ? 'fa-play' : 'fa-pause';
            playPauseButton.innerHTML = `<i class="fas ${icon}"></i>`;
            customPlayPauseButton.innerHTML = `<i class="fas ${icon}"></i>`;
        }

        function togglePlay() {
            if (video.paused || video.ended) {
                video.play().catch(error => console.error('Play error:', error));
            } else {
                video.pause();
            }
            updatePlayPauseButton();
        }

        playPauseButton.addEventListener('click', togglePlay);
        customPlayPauseButton.addEventListener('click', togglePlay);

        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                const percentage = (video.currentTime / video.duration) * 100;
                progress.style.width = percentage + '%';
                progressThumb.style.left = percentage + '%';
            }
        });

        video.addEventListener('progress', () => {
            if (video.buffered.length > 0) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const bufferedPercentage = (bufferedEnd / video.duration) * 100;
                buffered.style.width = bufferedPercentage + '%';
            }
        });

        progressBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            updateProgress(e);
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            isVolumeDragging = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) updateProgress(e);
            if (isVolumeDragging) updateVolume(e);
        });

        function updateProgress(e) {
            const rect = progressBar.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const percentage = Math.max(0, Math.min(100, (offsetX / rect.width) * 100));
            progress.style.width = percentage + '%';
            progressThumb.style.left = percentage + '%';
            if (video.duration) {
                video.currentTime = (percentage / 100) * video.duration;
            }
        }

        function updateVolume(e) {
            const rect = volumeSlider.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const percentage = Math.max(0, Math.min(100, (offsetX / rect.width) * 100));
            volumeProgress.style.width = percentage + '%';
            volumeThumb.style.left = percentage + '%';
            video.volume = percentage / 100;
        }

        volumeControl.addEventListener('click', () => {
            video.muted = !video.muted;
            volumeControl.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        });

        volumeSlider.addEventListener('mousedown', (e) => {
            isVolumeDragging = true;
            updateVolume(e);
        });

        function setVolumeSlider() {
            const volumePercentage = video.volume * 100;
            volumeProgress.style.width = volumePercentage + '%';
            volumeThumb.style.left = volumePercentage + '%';
        }

        fullscreenButton.addEventListener('click', () => {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) {
                video.msRequestFullscreen();
            }
        });

        video.addEventListener('waiting', () => {
            loadingOverlay.style.display = 'flex';
        });

        video.addEventListener('playing', () => {
            loadingOverlay.style.display = 'none';
            updatePlayPauseButton();
        });

        video.addEventListener('pause', () => {
            updatePlayPauseButton();
        });

        video.addEventListener('error', () => {
            loadingOverlay.style.display = 'none';
        });

        setVolumeSlider();
    });
    </script>
</body>
</html>
